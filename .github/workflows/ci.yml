name: CI

# Continuous integration for the iPermit monorepo (T01-07).
#
# Mirrors the local pre-commit checks (T01-02 / T01-12) plus the schema/rule
# validation and codegen-drift checks the engineering standards require.
#
# Deliberately NOT yet wired (each lands with the work it depends on):
#   - Benchmark regression testing  -> T04-02 (needs the rules engine, EPIC-03)
#   - Terraform validate/plan        -> T01-09 implementation / T05-01
#     (the infrastructure/terraform skeleton references modules that do not
#      exist yet; `terraform validate` would fail by design until then)
#   - Frontend (eslint/prettier) job -> activates when hand-written TS lands
#     under apps/ or services/ (only generated TS exists today)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Pin tool versions to match .pre-commit-config.yaml so local and CI agree.
env:
  RUFF_VERSION: "0.15.8"
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python lint, format, standards & validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Function-length rule (<= 60 body lines)
        # Exclude vendored (tools/), generated (shared-schemas/python), and
        # auto-generated Alembic migration scripts.
        run: |
          git ls-files '*.py' ':!:tools/**' ':!:packages/shared-schemas/python/**' \
            ':!:migrations/versions/**' \
            | xargs -r python scripts/checks/check_function_length.py

      - name: Schema & example validation
        run: python scripts/checks/validate_schemas.py

      - name: Rule validation
        run: python scripts/rules/validate_rules.py

      - name: Unit tests (pytest)
        # No tests exist yet; exit code 5 means "no tests collected" and is OK.
        # Use `|| status=$?` so bash -e does not abort before we inspect it.
        run: |
          status=0
          pytest -q || status=$?
          if [ "$status" -eq 5 ]; then
            echo "No tests collected yet — passing."
            exit 0
          fi
          exit "$status"

  schema-codegen:
    name: Schema codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check generated types match the canonical schemas
        # generate.py --check regenerates in memory and fails on any drift.
        # Node is present so the TS path uses json2ts (matching committed output).
        run: python scripts/schema/generate.py --check
