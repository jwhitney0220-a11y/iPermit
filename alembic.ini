# Alembic configuration for the iPermit monorepo (T02-01).
#
# The database URL is NOT hard-coded here; migrations/env.py reads it from the
# DATABASE_URL environment variable (T01-08 standard), defaulting to local
# SQLite. Run migrations with:  alembic upgrade head
[alembic]
script_location = migrations
prepend_sys_path = . packages/persistence packages/jurisdiction-models
path_separator = space
# version_path / file template kept at Alembic defaults.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
